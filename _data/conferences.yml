# =============================================================================
# Conference map & timeline data  ->  rendered by _pages/conferences.html
# (hidden page at /conferences/, not linked in the nav)
#
# One entry per conference edition. Papers are listed under each.
# Locations/dates were verified against the official conference sites.
#
# HOW TO EDIT:
#  - Add a new conference: copy a block, keep `id` unique (kebab-case).
#  - `attended: true`  -> gold ring on the map pin + "📍 Attended" tag.
#      Currently only set where attendance is explicitly documented
#      (NAACL 2024, Mexico City). Flip it to true for any you attended
#      in person (e.g. Albuquerque, Vienna, Suzhou, ...).
#  - `upcoming: true`  -> "Upcoming" tag (for events still ahead).
#  - `lat`/`lng` place the map pin. San Diego hosts two 2026 venues
#    (ACL + AmericasNLP), so AmericasNLP is nudged slightly so both pins
#    stay clickable.
#  - Paper `type` uses "🏆 Conference" or "🛠️ Workshop".
#  - The Preprint (no venue) is intentionally not shown here.
# =============================================================================

